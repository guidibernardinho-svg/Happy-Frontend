name: macOS Qt Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.0'

      - name: Check files
        run: ls desktop-app

      - name: Configure
        run: cmake -S desktop-app -B build

      - name: Build
        run: cmake --build build
