name: Windows Build (Qt - Happy Frontend)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.0'
          host: 'windows'
          target: 'desktop'

      - name: Configure project (CMake)
        run: cmake -S desktop-app -B build

      - name: Build project
        run: cmake --build build --config Release

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: happy-frontend-windows
          path: build/
